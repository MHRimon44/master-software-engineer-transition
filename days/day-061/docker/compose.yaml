name: day61-fullstack

services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app-network

  api:
    build:
      context: ../../day-058/backend/team-task-api
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - '${API_PORT:-3003}:3000'

    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

    networks:
      - app-network

  web:
    build:
      context: ../../day-056/web/devflow-performance-lab
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - '${WEB_PORT:-3004}:3000'

    depends_on:
      api:
        condition: service_healthy

    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
